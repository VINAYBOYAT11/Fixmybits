name: FixMyBits CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Lint · Test · Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fixmybits_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/fixmybits_test
      CELERY_BROKER_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1
      FRONTEND_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with flake8
        run: |
          flake8 apps/ fixmybits/ \
            --max-line-length=120 \
            --exclude=migrations,venv \
            --count --statistics

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests with coverage
        run: |
          pytest --cov=apps --cov-report=term-missing --cov-fail-under=60 -v

      - name: Security scan (pip-audit)
        run: pip-audit --requirement requirements.txt --strict

      - name: Security scan (safety)
        run: safety check -r requirements.txt
        continue-on-error: true  # Advisory — won't fail the build
